<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte | Loja de Jogos</title>
    <link rel="stylesheet" href="T1.css">
</head>
<body>
    <header class="cabeca">
        <a href="index.html">Página Inicial</a>
        <img src="img/Logo.png" alt="Logo da loja">
    </header>

    <main class="suporte">
        <div class="Supo">
            <form id="formSuporte">
                <h2>O que podemos ajudar?</h2>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" rows="8" maxlength="500"
                    placeholder="Digite sua mensagem aqui..." required></textarea>
                <small id="contador">0/500</small>

                <button type="submit" id="meuBotao">Enviar</button>
            </form>
        </div>

        <div class="RS">
            <h2>Redes Sociais</h2>
            <article>
                <h4>Instagram</h4>
                <a href="https://www.instagram.com/" target="_blank">
                    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/95/Instagram_logo_2022.svg/1280px-Instagram_logo_2022.svg.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="Instagram">
                </a>
            </article>
            <article>
                <h4>Twitter</h4>
                <a href="https://twitter.com/" target="_blank">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmqrGvgJrnpSPqodE9f90qjx2jm9_Zijk6Vtq65g1BFw&s" alt="Twitter">
                </a>
            </article>
        </div>
    </main>

   <footer>
    <p>© 2024 Loja de Jogos. Todos os direitos reservados.</p>
</footer> 

    
</body>
</html>
